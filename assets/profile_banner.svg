<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="240">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0A0D14"/>
    </linearGradient>

    <!-- Neon Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 900;
        font-size: 50px;
        fill: #FFFFFF;
        letter-spacing: 4px;
      }
      .period {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 900;
        font-size: 54px;
        fill: #6366F1;
      }
      .subtitle {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 19px;
        fill: #94A3B8;
        letter-spacing: 1.5px;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 700;
        font-size: 13px;
        fill: #E2E8F0;
        letter-spacing: 1px;
      }
      .wave-line {
        stroke: url(#accentGrad);
        stroke-width: 2.5;
        fill: none;
        opacity: 0.85;
      }
      .grid-dot {
        fill: #374151;
        opacity: 0.35;
      }
    </style>
  </defs>

  <!-- Container Box with Rounded Corners & Glow Border -->
  <rect x="2" y="2" width="896" height="236" rx="16" fill="url(#bgGrad)" stroke="#1F2937" stroke-width="2"/>

  <!-- Tech Grid Background -->
  <g class="grid-dot">
    <circle cx="60" cy="40" r="1.5"/><circle cx="100" cy="40" r="1.5"/><circle cx="140" cy="40" r="1.5"/>
    <circle cx="60" cy="80" r="1.5"/><circle cx="100" cy="80" r="1.5"/><circle cx="140" cy="80" r="1.5"/>
    <circle cx="760" cy="40" r="1.5"/><circle cx="800" cy="40" r="1.5"/><circle cx="840" cy="40" r="1.5"/>
    <circle cx="760" cy="80" r="1.5"/><circle cx="800" cy="80" r="1.5"/><circle cx="840" cy="80" r="1.5"/>
    <circle cx="760" cy="120" r="1.5"/><circle cx="800" cy="120" r="1.5"/><circle cx="840" cy="120" r="1.5"/>
  </g>

  <!-- Ambient Glow Orbs -->
  <circle cx="150" cy="70" r="80" fill="#6366F1" opacity="0.12" filter="url(#glow)"/>
  <circle cx="750" cy="140" r="90" fill="#06B6D4" opacity="0.10" filter="url(#glow)"/>

  <!-- Modern Accent Bars -->
  <path d="M 50 185 C 200 160, 350 200, 500 175 C 650 150, 780 190, 850 170" class="wave-line"/>
  <rect x="50" y="45" width="4" height="60" rx="2" fill="url(#accentGrad)" filter="url(#subtleGlow)"/>

  <!-- Founder Typography -->
  <text x="70" y="85" class="title">VASANTH<tspan class="period">.</tspan></text>
  <text x="70" y="125" class="subtitle">Founder &amp; Software Architect  •  L3NZO. SOFTWARE SERVICES</text>

  <!-- Pill Badges -->
  <!-- Badge 1: Enterprise MSME -->
  <g transform="translate(70, 155)">
    <rect x="0" y="0" width="220" height="32" rx="16" fill="#1E1B4B" stroke="#4F46E5" stroke-width="1.2"/>
    <circle cx="16" cy="16" r="4.5" fill="#10B981"/>
    <text x="28" y="21" class="badge-text" fill="#818CF8">GOVT MSME REGISTERED</text>
  </g>

  <!-- Badge 2: Flagship Product -->
  <g transform="translate(305, 155)">
    <rect x="0" y="0" width="165" height="32" rx="16" fill="#082F49" stroke="#0284C7" stroke-width="1.2"/>
    <text x="18" y="21" class="badge-text" fill="#38BDF8">⚡ L3NZO. DESKTOP</text>
  </g>

  <!-- Badge 3: Architecture -->
  <g transform="translate(485, 155)">
    <rect x="0" y="0" width="180" height="32" rx="16" fill="#1E293B" stroke="#475569" stroke-width="1.2"/>
    <text x="18" y="21" class="badge-text" fill="#94A3B8">OFFLINE-FIRST SAAS</text>
  </g>
</svg>
